name: Build and Release DuckDB Libraries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      duckdb_version:
        description: 'DuckDB version to build (e.g., v1.5.5). Defaults to the DUCKDB_VERSION file.'
        required: false

jobs:
  build-ios:
    name: Build iOS Framework
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve DuckDB version
        run: |
          version="${{ github.event.inputs.duckdb_version }}"
          [ -n "$version" ] || version="$(cat DUCKDB_VERSION)"
          echo "DUCKDB_VERSION=$version" >> "$GITHUB_ENV"
          echo "Building DuckDB $version"

      - name: Install dependencies
        run: |
          brew install ninja cmake ccache

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ios-${{ env.DUCKDB_VERSION }}

      - name: Build iOS Device Framework
        working-directory: ios
        run: |
          make -f Makefile.internal VERSION="$DUCKDB_VERSION" device

      - name: Build iOS Simulator Framework
        working-directory: ios
        run: |
          make -f Makefile.internal VERSION="$DUCKDB_VERSION" simulator

      - name: Create XCFramework
        working-directory: ios
        run: |
          rm -rf Libraries/release/duckdb.xcframework Libraries/release/xcf-staging
          mkdir -p Libraries/release/xcf-staging/device Libraries/release/xcf-staging/sim
          cp -R Libraries/release/duckdb.framework Libraries/release/xcf-staging/device/duckdb.framework
          cp -R Libraries/release/duckdb.framework.sim Libraries/release/xcf-staging/sim/duckdb.framework
          xcodebuild -create-xcframework \
            -framework Libraries/release/xcf-staging/device/duckdb.framework \
            -framework Libraries/release/xcf-staging/sim/duckdb.framework \
            -output Libraries/release/duckdb.xcframework
          rm -rf Libraries/release/xcf-staging

      - name: Package iOS Device Framework
        working-directory: ios
        run: |
          cd Libraries/release
          zip -r duckdb-framework-ios.zip duckdb.framework

      - name: Package iOS Simulator Framework
        working-directory: ios
        run: |
          cd Libraries/release
          zip -r duckdb-framework-ios-simulator.zip duckdb.framework.sim

      - name: Package iOS XCFramework
        working-directory: ios
        run: |
          cd Libraries/release
          zip -r duckdb-xcframework-ios.zip duckdb.xcframework

      - name: Upload iOS Device Framework
        uses: actions/upload-artifact@v4
        with:
          name: duckdb-framework-ios
          path: ios/Libraries/release/duckdb-framework-ios.zip

      - name: Upload iOS Simulator Framework
        uses: actions/upload-artifact@v4
        with:
          name: duckdb-framework-ios-simulator
          path: ios/Libraries/release/duckdb-framework-ios-simulator.zip

      - name: Upload iOS XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: duckdb-xcframework-ios
          path: ios/Libraries/release/duckdb-xcframework-ios.zip

  build-android:
    name: Build Android Libraries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve DuckDB version
        run: |
          version="${{ github.event.inputs.duckdb_version }}"
          [ -n "$version" ] || version="$(cat DUCKDB_VERSION)"
          echo "DUCKDB_VERSION=$version" >> "$GITHUB_ENV"
          echo "Building DuckDB $version"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake ccache

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-${{ matrix.abi }}-${{ env.DUCKDB_VERSION }}

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3

      - name: Set NDK environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_ROOT" >> $GITHUB_ENV

      - name: Build Android ${{ matrix.abi }}
        working-directory: android
        run: |
          make -f Makefile.internal VERSION="$DUCKDB_VERSION" build_${{ matrix.abi }}

      - name: Package Android Library
        working-directory: android
        run: |
          cd src/main/jniLibs/${{ matrix.abi }}
          zip libduckdb-android_${{ matrix.abi }}.zip libduckdb.so

      - name: Upload Android Library
        uses: actions/upload-artifact@v4
        with:
          name: libduckdb-android_${{ matrix.abi }}
          path: android/src/main/jniLibs/${{ matrix.abi }}/libduckdb-android_${{ matrix.abi }}.zip

  release:
    name: Create Release
    needs: [build-ios, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/duckdb-framework-ios/duckdb-framework-ios.zip
            artifacts/duckdb-framework-ios-simulator/duckdb-framework-ios-simulator.zip
            artifacts/duckdb-xcframework-ios/duckdb-xcframework-ios.zip
            artifacts/libduckdb-android_arm64-v8a/libduckdb-android_arm64-v8a.zip
            artifacts/libduckdb-android_armeabi-v7a/libduckdb-android_armeabi-v7a.zip
            artifacts/libduckdb-android_x86_64/libduckdb-android_x86_64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
